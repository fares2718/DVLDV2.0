<main class="min-h-screen bg-gray-100 flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <!-- Logo / Brand -->
    <div class="text-center mb-8">
      <div
        class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-xl bg-gray-900 text-white shadow-sm"
      >
        <span class="text-xl font-bold">D</span>
      </div>

      <h1 class="text-2xl font-bold tracking-tight text-gray-900">DVLD</h1>

      <p class="mt-1 text-sm text-gray-500">Driver & Vehicle Licensing Department</p>
    </div>

    <!-- Login Card -->
    <div class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm sm:p-8">
      <!-- Header -->
      <div class="mb-6">
        <h2 class="text-xl font-semibold text-gray-900">Sign in</h2>

        <p class="mt-1 text-sm text-gray-500">Enter your credentials to access your account.</p>
      </div>

      <!-- Form -->
      <form class="space-y-5" [formGroup]="form" (ngSubmit)="onSubmit()">
        <!-- Username -->
        <div>
          <label for="username" class="mb-2 block text-sm font-medium text-gray-700">
            Username
          </label>

          <input
            id="username"
            type="text"
            name="username"
            formControlName="username"
            autocomplete="username"
            placeholder="Enter your username"
            class="block w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 placeholder:text-gray-400 outline-none transition focus:border-gray-900 focus:ring-2 focus:ring-gray-900/10"
          />
        </div>

        <!-- Password -->
        <div>
          <div class="mb-2 flex items-center justify-between">
            <label for="password" class="block text-sm font-medium text-gray-700"> Password </label>

            <a
              href="#"
              class="text-sm font-medium text-gray-700 hover:text-gray-900 hover:underline"
            >
              Forgot password?
            </a>
          </div>

          <input
            id="password"
            type="password"
            name="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            class="block w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 placeholder:text-gray-400 outline-none transition focus:border-gray-900 focus:ring-2 focus:ring-gray-900/10"
          />
        </div>

        <!-- Remember Me -->
        <div class="flex items-center">
          <input
            id="remember"
            type="checkbox"
            name="remember"
            class="h-4 w-4 rounded border-gray-300 text-gray-900 focus:ring-gray-900"
          />

          <label for="remember" class="ml-2 text-sm text-gray-600"> Remember me </label>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="w-full rounded-lg bg-gray-900 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-2 active:bg-gray-950"
        >
          Sign in
        </button>
      </form>

      <!-- Security Note -->
      <div class="mt-6 border-t border-gray-100 pt-5">
        <p class="text-center text-xs text-gray-400">Authorized personnel only</p>
      </div>
    </div>

    <!-- Footer -->
    <p class="mt-6 text-center text-xs text-gray-400">© 2026 DVLD. All rights reserved.</p>
  </div>
</main>
