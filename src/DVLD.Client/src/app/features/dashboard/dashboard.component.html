<main class="min-h-screen bg-gray-100 px-4 py-6 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-7xl">
    <!-- Header -->
    <header class="mb-8">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-gray-900">Dashboard</h1>

          <p class="mt-1 text-sm text-gray-500">
            Overview of the Driver & Vehicle Licensing Department
          </p>
        </div>
      </div>
    </header>

    <!-- Dashboard Widgets -->
    <section class="grid grid-cols-1 gap-5 md:grid-cols-2 xl:grid-cols-3">
      @for (component of components(); track component.permission) {
        <ng-container *ngComponentOutlet="component.component" />
      }
    </section>
  </div>
</main>
