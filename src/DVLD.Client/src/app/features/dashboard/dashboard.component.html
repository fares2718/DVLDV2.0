<div class="min-h-full bg-gray-50 p-4 sm:p-6 lg:p-8">
  <header class="mb-8">
    <h1 class="text-2xl font-bold tracking-tight text-gray-900 sm:text-3xl">Dashboard</h1>

    <p class="mt-1 text-sm text-gray-500">Overview of the driving license management system</p>
  </header>

  <section class="grid grid-cols-1 gap-5 md:grid-cols-2 xl:grid-cols-3">
    @for (component of components(); track component.permission) {
      <ng-container *ngComponentOutlet="component.component" />
    }
  </section>
</div>
