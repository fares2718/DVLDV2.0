<aside class="sticky top-0 h-screen w-64 shrink-0 border-r border-gray-200 bg-white">
  <!-- Brand -->
  <div class="flex h-16 items-center border-b border-gray-100 px-5">
    <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-gray-900 text-white">
      <span class="text-sm font-bold">D</span>
    </div>

    <div class="ml-3">
      <p class="text-sm font-bold text-gray-900">DVLD</p>

      <p class="text-xs text-gray-400">Licensing Department</p>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="space-y-1 p-3">
    @for (item of visibleItems(); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-gray-100 text-gray-900"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
        class="flex items-center rounded-lg px-3 py-2.5 text-sm font-medium text-gray-600 transition hover:bg-gray-50 hover:text-gray-900"
      >
        <!-- icon later -->

        <span>
          {{ item.label }}
        </span>
      </a>
    }
  </nav>
</aside>
